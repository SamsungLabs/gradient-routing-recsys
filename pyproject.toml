[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-routing-recsys"
version = "0.1.0"
description = "Gradient routing algorithm for recommender systems"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3 :: 11"
]
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.isort]
profile = "black"
