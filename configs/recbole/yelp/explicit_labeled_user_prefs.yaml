# dataset config : Context-aware Recommendation
load_col:
    inter: [ 'review_id', 'user_id', 'business_id', 'stars', 'useful', 'funny', 'cool', 'date', 'user_pref_vector_explicit' ]
    user: ["user_id", "user_name", "user_review_count", "yelping_since", "user_useful", "user_funny", "user_cool", "elite", "fans", "average_stars", "compliment_hot", "compliment_more", "compliment_profile", "compliment_cute", "compliment_list", "compliment_note", "compliment_plain", "compliment_cool", "compliment_funny", "compliment_writer", "compliment_photos"]
    item: ['business_id', 'item_name', 'address', 'city', 'state', 'postal_code', 'latitude', 'longitude', 'item_stars', 'item_review_count', 'is_open', 'categories']
numerical_features: ['user_pref_vector_explicit']
threshold: {'stars': 4.0}

user_inter_num_interval: "[20, inf)"

ITEM_ID_FIELD: "business_id"
RATING_FIELD: "stars"
TIME_FIELD: "date"

# model config
# TBD after hyperparameter tuning
embedding_size: 64
double_tower: True

# Training and evaluation config
epochs: 25
train_batch_size: 128
eval_batch_size: 256  # Reduced from 4096 to avoid CUDA OOM with HierarchicalRecommender
learning_rate: 0.001
stopping_step: 5
eval_args:
  split: {'RS':[0.8,0.1,0.1]}
  order: TO
  group_by: "user"
  mode: labeled
train_neg_sample_args: null
metrics: ['AUC', 'LogLoss']
valid_metric: AUC
metric_decimal_place: 5