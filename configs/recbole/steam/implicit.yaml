# dataset config : Context-aware Recommendation
load_col:
    inter: [ 'user_id', 'product_id', 'timestamp' ]
    user: [ 'user_id' ]
    item: [ 'app_name', 'developer', 'early_access', 'genres', 'product_id', 'metascore', 'publisher', 'timestamp', 'sentiment', 'specs', 'tags', 'title' ]

ITEM_ID_FIELD: "product_id"
TIME_FIELD: "timestamp"

seq_separator: ", "
user_inter_num_interval: "[20, inf)"

# model config
# TBD after hyperparameter tuning
embedding_size: 64
double_tower: True

# Training and evaluation config
epochs: 25
train_batch_size: 128
eval_batch_size: 4096
learning_rate: 0.001
stopping_step: 5
eval_args:
  split: {'RS':[0.8,0.1,0.1]}
  order: TO
  group_by: "user"
  mode: uni100
train_neg_sample_args:
  uniform: 1
metrics: [
  'Recall',
  'MRR',
  'NDCG',
  'Hit',
  'MAP',
  'Precision',
  'GAUC',
  'ShannonEntropy',
]
valid_metric: MRR@10
metric_decimal_place: 5
